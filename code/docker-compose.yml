version: '3'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: CHANGE_ME_BEFORE_RUNNING
      MYSQL_DATABASE: db_estate
      MYSQL_USER: root
      MYSQL_PASSWORD: CHANGE_ME_BEFORE_RUNNING
